; LilyGO T-LoRa Pager (ESP32-S3 + SX1262 + ST7796 + TCA8418 keyboard)
; Bring-up variant for the MeshCore T-LoRa Pager work (MULT-194 / MULT-197).
;
; Pin map is from the Stage-1 hardware audit (MULT-195) cross-checked against
; meshtastic/firmware variants/esp32s3/tlora-pager/variant.h.

[LilyGo_TLoRaPager]
extends = esp32_base
board = tlora-pager
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_tlora_pager
  -I examples/companion_radio
  -D LILYGO_TLORA_PAGER
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=0
  ; SX1262 radio (shares the SPI host / bus with the ST7796 display, separate CS)
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0f
  -D P_LORA_NSS=36
  -D P_LORA_DIO_1=14   ; SX1262 IRQ
  -D P_LORA_RESET=47
  -D P_LORA_BUSY=48
  -D P_LORA_SCLK=35
  -D P_LORA_MOSI=34
  -D P_LORA_MISO=33
  ; I2C bus: TCA8418 keyboard, BQ27220 fuel gauge, RTC, haptics
  -D PIN_BOARD_SDA=3
  -D PIN_BOARD_SCL=2
  ; Inputs
  -D PIN_USER_BTN=0
  -D PIN_ROTARY_A=40
  -D PIN_ROTARY_B=41
  -D PIN_ROTARY_PRESS=7
  ; TCA8418 keyboard
  -D KB_INT_PIN=6
  -D KB_BL_PIN=46
  -D KB_I2C_ADDR=0x32
  ; GPS (compile-time optional; kept off for the bring-up stub)
  -D PIN_GPS_RX=4
  -D PIN_GPS_TX=12
  -D PIN_GPS_PPS=13
  -D GPS_BAUD_RATE=38400
  -D ENV_INCLUDE_GPS=0
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tlora_pager>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/TCA8418Keyboard.cpp>
  +<helpers/ui/RotaryInputGPIO.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.28
  https://github.com/mverch67/BQ27220/archive/07d92be846abd8a0258a50c23198dac0858b22ed.zip

; Bring-up / boot-test firmware (MULT-197 Stage 2). The full pager chat UI is
; the Stage-3 issue (MULT-198) and builds on top of this variant.
[env:LilyGo_TLoRaPager_pager]
extends = LilyGo_TLoRaPager
build_flags =
  ${LilyGo_TLoRaPager.build_flags}
build_src_filter = ${LilyGo_TLoRaPager.build_src_filter}
  +<../examples/pager>
  +<../examples/companion_radio/DataStore.cpp>
lib_deps =
  ${LilyGo_TLoRaPager.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostics build: native USB CDC serial, stage logs, and screen timeout disabled.
[env:LilyGo_TLoRaPager_pager_debug]
extends = LilyGo_TLoRaPager
build_flags =
  ${LilyGo_TLoRaPager.build_flags}
  -UARDUINO_USB_CDC_ON_BOOT
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PAGER_DEBUG=1
build_src_filter = ${LilyGo_TLoRaPager.build_src_filter}
  +<../examples/pager>
  +<../examples/companion_radio/DataStore.cpp>
lib_deps =
  ${LilyGo_TLoRaPager.lib_deps}
  densaugeo/base64 @ ~1.4.0
